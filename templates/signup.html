<!DOCTYPE html>
<html>
<head>
    <title>Signup - NovaLink</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div>
            <div class="logo">NovaLink</div>
            <div class="tagline">Connect • Share • Inspire</div>
        </div>

    </nav>

    <!-- SIGNUP BOX -->
    <div class="auth-container">

        <div class="auth-card">

            <h2>Create Account</h2>

            <form method="POST" id="signupForm">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <label class="field-label" for="date_of_birth">Date of birth</label>
                <input
                    type="date"
                    name="date_of_birth"
                    id="date_of_birth"
                    required
                    onchange="checkAge()"
                >

                <!-- Only shown/required if the user is under 18 -->
                <div id="parentEmailWrapper" style="display:none;">
                    <p class="minor-note">
                        Since you're under 18, we need a parent or guardian's email
                        to activate your account. They'll get a confirmation link,
                        and we'll notify them if any of your posts or comments get
                        blocked by our safety filters.
                    </p>
                    <input
                        type="email"
                        name="parent_email"
                        id="parent_email"
                        placeholder="Parent/Guardian Email"
                    >
                </div>

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p style="text-align:center; margin-top:15px;">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

    <script>
        function checkAge() {
            const dobInput = document.getElementById("date_of_birth");
            const wrapper = document.getElementById("parentEmailWrapper");
            const parentEmailField = document.getElementById("parent_email");

            if (!dobInput.value) return;

            const dob = new Date(dobInput.value);
            const today = new Date();

            let age = today.getFullYear() - dob.getFullYear();
            const monthDiff = today.getMonth() - dob.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
                age--;
            }

            if (age < 18) {
                wrapper.style.display = "block";
                parentEmailField.setAttribute("required", "required");
            } else {
                wrapper.style.display = "none";
                parentEmailField.removeAttribute("required");
            }
        }
    </script>

</body>
</html>
